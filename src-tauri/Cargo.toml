[package]
name = "loka"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fanrsd/LOKA"

[lib]
name = "loka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "fs", "io-util", "macros", "rt", "sync"] }
socket2 = "0.6"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-notification = "2"
if-addrs = "0.15.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSResponder"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3.7.0", default-features = false }
