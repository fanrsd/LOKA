[package]
name = "loka"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fanrsd/LOKA"

[lib]
name = "loka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "fs", "io-util", "macros", "rt", "sync"] }
socket2 = "0.6"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-notification = "2"
if-addrs = "0.15.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
base64 = "0.23.1"
mac_address = "1.2.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "UI_Notifications", "UI_Notifications_Management", "ApplicationModel", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }
windows-core = "0.62"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_DataExchange"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSWindow", "NSResponder", "NSPasteboard", "NSFilePromiseProvider", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSView", "NSApplication", "NSImage", "NSGraphicsContext"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSEnumerator", "NSURL", "NSError", "NSOperation", "NSGeometry", "NSData", "NSDictionary"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png"] }
drag = "2.1"
cpal = "0.18.2"
portable-pty = "0.9.0"
dav-server = "0.11.0"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
