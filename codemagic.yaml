# macOS build. Runs on tags like v0.1.0 (or start it from the Codemagic UI / API).
# The universal .dmg is a build artifact; attach it to the GitHub release with `gh release upload`.
workflows:
  macos:
    name: LOKA macOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
    scripts:
      - name: Install Rust
        script: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "PATH=$HOME/.cargo/bin:$PATH" >> $CM_ENV
      - name: Add both Mac targets
        script: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install npm packages
        script: npm ci
      - name: Build universal dmg
        script: npx tauri build --target universal-apple-darwin --bundles dmg
    artifacts:
      - src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
